# Kubernetes deployment configuration for ChemiAccel Inference Server
# Supports GPU acceleration, horizontal scaling, and load balancing
---
apiVersion: v1
kind: Namespace
metadata:
  name: chemi-accel
  labels:
    name: chemi-accel

---
# ConfigMap for server configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: chemi-accel-config
  namespace: chemi-accel
data:
  CHEMI_ACCEL_ENV: "production"
  CHEMI_ACCEL_LOG_LEVEL: "INFO"
  CHEMI_ACCEL_MAX_BATCH_SIZE: "1000"
  CHEMI_ACCEL_PRELOAD_MODELS: "true"
  CHEMI_ACCEL_WORKERS: "1"

---
# Secret for sensitive configuration (if needed)
apiVersion: v1
kind: Secret
metadata:
  name: chemi-accel-secrets
  namespace: chemi-accel
type: Opaque
data:
  # Base64 encoded values
  api-key: Y2hlbWktYWNjZWwtYXBpLWtleQ==  # Example: chemi-accel-api-key

---
# PersistentVolumeClaim for model storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chemi-accel-models-pvc
  namespace: chemi-accel
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: fast-ssd

---
# PersistentVolumeClaim for logs
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chemi-accel-logs-pvc
  namespace: chemi-accel
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard

---
# GPU-enabled deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chemi-accel-inference-gpu
  namespace: chemi-accel
  labels:
    app: chemi-accel-inference
    variant: gpu
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chemi-accel-inference
      variant: gpu
  template:
    metadata:
      labels:
        app: chemi-accel-inference
        variant: gpu
    spec:
      containers:
      - name: chemi-accel-inference
        image: chemi-accel/inference:gpu-latest
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - configMapRef:
            name: chemi-accel-config
        env:
        - name: CUDA_VISIBLE_DEVICES
          value: "0"
        - name: NVIDIA_VISIBLE_DEVICES
          value: "all"
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: "compute,utility"
        resources:
          requests:
            memory: "4Gi"
            cpu: "2"
            nvidia.com/gpu: 1
          limits:
            memory: "8Gi"
            cpu: "4"
            nvidia.com/gpu: 1
        volumeMounts:
        - name: models-storage
          mountPath: /app/models
        - name: logs-storage
          mountPath: /app/logs
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 12
      volumes:
      - name: models-storage
        persistentVolumeClaim:
          claimName: chemi-accel-models-pvc
      - name: logs-storage
        persistentVolumeClaim:
          claimName: chemi-accel-logs-pvc
      nodeSelector:
        accelerator: nvidia-tesla-v100  # Adjust based on available GPU nodes
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule

---
# CPU-only deployment (fallback)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chemi-accel-inference-cpu
  namespace: chemi-accel
  labels:
    app: chemi-accel-inference
    variant: cpu
spec:
  replicas: 3
  selector:
    matchLabels:
      app: chemi-accel-inference
      variant: cpu
  template:
    metadata:
      labels:
        app: chemi-accel-inference
        variant: cpu
    spec:
      containers:
      - name: chemi-accel-inference
        image: chemi-accel/inference:cpu-latest
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - configMapRef:
            name: chemi-accel-config
        env:
        - name: CHEMI_ACCEL_USE_GPU
          value: "false"
        - name: CHEMI_ACCEL_MAX_BATCH_SIZE
          value: "500"
        resources:
          requests:
            memory: "2Gi"
            cpu: "1"
          limits:
            memory: "4Gi"
            cpu: "2"
        volumeMounts:
        - name: models-storage
          mountPath: /app/models
        - name: logs-storage
          mountPath: /app/logs
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 12
      volumes:
      - name: models-storage
        persistentVolumeClaim:
          claimName: chemi-accel-models-pvc
      - name: logs-storage
        persistentVolumeClaim:
          claimName: chemi-accel-logs-pvc

---
# Service for GPU deployment
apiVersion: v1
kind: Service
metadata:
  name: chemi-accel-inference-gpu-service
  namespace: chemi-accel
  labels:
    app: chemi-accel-inference
    variant: gpu
spec:
  selector:
    app: chemi-accel-inference
    variant: gpu
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  type: ClusterIP

---
# Service for CPU deployment
apiVersion: v1
kind: Service
metadata:
  name: chemi-accel-inference-cpu-service
  namespace: chemi-accel
  labels:
    app: chemi-accel-inference
    variant: cpu
spec:
  selector:
    app: chemi-accel-inference
    variant: cpu
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  type: ClusterIP

---
# Load balancer service
apiVersion: v1
kind: Service
metadata:
  name: chemi-accel-inference-service
  namespace: chemi-accel
  labels:
    app: chemi-accel-inference
spec:
  selector:
    app: chemi-accel-inference
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  type: LoadBalancer
  sessionAffinity: None

---
# Horizontal Pod Autoscaler for GPU deployment
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chemi-accel-inference-gpu-hpa
  namespace: chemi-accel
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chemi-accel-inference-gpu
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 60

---
# Horizontal Pod Autoscaler for CPU deployment
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chemi-accel-inference-cpu-hpa
  namespace: chemi-accel
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chemi-accel-inference-cpu
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
# Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: chemi-accel-inference-pdb
  namespace: chemi-accel
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: chemi-accel-inference

---
# Network Policy for security
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chemi-accel-inference-network-policy
  namespace: chemi-accel
spec:
  podSelector:
    matchLabels:
      app: chemi-accel-inference
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-system
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - {}  # Allow all egress traffic

---
# Ingress for external access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chemi-accel-inference-ingress
  namespace: chemi-accel
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  tls:
  - hosts:
    - api.chemi-accel.com
    secretName: chemi-accel-tls
  rules:
  - host: api.chemi-accel.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: chemi-accel-inference-service
            port:
              number: 80

---
# ServiceMonitor for Prometheus monitoring
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: chemi-accel-inference-monitor
  namespace: chemi-accel
  labels:
    app: chemi-accel-inference
spec:
  selector:
    matchLabels:
      app: chemi-accel-inference
  endpoints:
  - port: http
    path: /metrics/prometheus
    interval: 30s
    scrapeTimeout: 10s

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chemi-accel"
version = "0.1.0"
description = "High-performance GPU-accelerated molecular descriptor calculations"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "ChemiAccel Team", email = "team@chemi-accel.org"}
]
maintainers = [
    {name = "ChemiAccel Team", email = "team@chemi-accel.org"}
]
keywords = [
    "cheminformatics",
    "molecular-descriptors", 
    "gpu-acceleration",
    "cuda",
    "jax",
    "rapids",
    "machine-learning"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9", 
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.8"

# Core dependencies
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "rdkit>=2022.03.1",
    "scipy>=1.7.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
# CUDA backend dependencies
cuda = [
    "cupy-cuda11x>=10.0.0",
    "cudf-cu11>=22.04",
    "cugraph-cu11>=22.04",
    "numba>=0.56.0",
]

# JAX backend dependencies  
jax = [
    "jax[cuda11_pip]>=0.4.0",
    "jaxlib>=0.4.0",
    "optax>=0.1.4",
]

# Development dependencies
dev = [
    "black>=22.0.0",
    "isort>=5.10.0", 
    "mypy>=0.950",
    "pre-commit>=2.17.0",
    "ruff>=0.0.260",
]

# Testing dependencies
test = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "pytest-xdist>=2.5.0",
    "pytest-asyncio>=0.21.0",
    "hypothesis>=6.40.0",
    "pytest-benchmark>=3.4.0",
]

# Documentation dependencies
docs = [
    "sphinx>=4.5.0",
    "sphinx-rtd-theme>=1.0.0",
    "myst-parser>=0.17.0",
    "sphinx-autodoc-typehints>=1.17.0",
]

# All optional dependencies
all = [
    "chemi-accel[cuda,jax,dev,test,docs]"
]

[project.urls]
Homepage = "https://github.com/chemi-accel/chemi-accel"
Documentation = "https://chemi-accel.readthedocs.io"
Repository = "https://github.com/chemi-accel/chemi-accel"
"Bug Tracker" = "https://github.com/chemi-accel/chemi-accel/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"chemi_accel" = ["py.typed"]

# Black configuration
[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# isort configuration
[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["chemi_accel"]

# MyPy configuration
[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "rdkit.*",
    "cupy.*", 
    "cudf.*",
    "cugraph.*",
    "jax.*",
    "jaxlib.*",
]
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "--strict-markers",
    "--strict-config",
]
testpaths = ["tests"]
markers = [
    "cuda: marks tests as requiring CUDA (deselect with '-m \"not cuda\"')",
    "jax: marks tests as requiring JAX (deselect with '-m \"not jax\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "benchmark: marks tests as benchmarks",
    "asyncio: marks tests as async tests requiring asyncio",
]

# Ruff configuration
[tool.ruff]
target-version = "py38"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["B011"]
# ChemiAccel Pre-commit Configuration
# Ensures code quality, formatting, and QA hygiene standards

repos:
  # Code formatting
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3
        args: [--line-length=88]
        exclude: ^(docs/|examples/legacy/)

  # Import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black, --line-length=88]
        exclude: ^(docs/|examples/legacy/)

  # Linting with ruff (faster than flake8)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix, --ignore=E402,F401,F811,B007,F841]
        exclude: ^(docs/|examples/legacy/|tests/fixtures/)

  # Type checking with mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies:
          - types-requests
          - types-PyYAML
          - numpy
          - pandas-stubs
        args: [--ignore-missing-imports, --strict-optional]
        exclude: ^(docs/|examples/|tests/fixtures/|benchmarks/legacy/)

  # Security checks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args: [-r, -x, tests/, --skip, B110,B603,B607]
        exclude: ^(tests/|examples/test_)

  # Jupyter notebook cleanup
  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.7.1
    hooks:
      - id: nbqa-black
        additional_dependencies: [black==23.12.1]
        args: [--line-length=88]
      - id: nbqa-isort
        additional_dependencies: [isort==5.13.2]
        args: [--profile=black]
      # Temporarily disabled due to commit issues
      # - id: nbqa-ruff
      #   additional_dependencies: [ruff==0.1.9]

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(.*\.md|docs/)
      - id: end-of-file-fixer
        exclude: ^(docs/|.*\.(png|jpg|jpeg|gif|ico)$)
      - id: check-yaml
        exclude: ^(docs/|conda-recipe/|k8s/)
      - id: check-json
        exclude: ^(docs/|\.vscode/)
      - id: check-toml
      - id: check-xml
      - id: check-added-large-files
        args: [--maxkb=10000]  # Allow files up to 10MB (for model files)
      - id: check-merge-conflict
      - id: debug-statements
        exclude: ^(tests/|examples/debug_)
      - id: check-docstring-first
        exclude: ^(tests/|examples/|benchmarks/)

